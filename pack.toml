# TOFFLOGO.act: the Office Logo as a single still picture (one pose; its own description
# reads "Absolutely No Moving Parts.").
[labels.tofflogo-97]
product = "Office 97 (static)"

# DOLPHIN.act names Kairu in its Japanese entry only.
[labels.dolphin-97]
product = "Office 97 (Japanese)"

# OFFLADY.act: Japanese entry only, item name 冴子先生 (Saeko-sensei).
[labels.offlady-97]
name = "Saeko-sensei"
product = "Office 97 (Japanese)"

# ROCKY(Greetings).ACT and ROCKY(EarlyGreetings).ACT: the file stem is ROCKY and the picture
# is the dog later shipped as Rocky, but both files name the character Rover, and their own
# description starts "Rover is an experienced cyberguide". The ids follow the file stem
# (A-ID-1), the name follows the file. "early version" is the collector's file qualifier.
[labels.rocky-greetings-act]
product = "Greetings Workshop"

[labels.rocky-earlygreetings-act]
product = "Greetings Workshop (early version)"

# TUTOR.ACT names its character "Unnamed".
[labels.tutor-act]
name = "Tutor"
product = "My Personal Tutor"
