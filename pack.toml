name = "classics"
licence = "none: Microsoft characters, converted from the user's own files; see README.md"
provenance = "Generated by regenerate.sh from Microsoft Agent 2.0 (ACS), Agent 1.5 and Office 97 / Microsoft Bob (ACT) files and OBALLOON.DLL; see README.md"
description = "Microsoft Agent and Office Assistant characters plus the Office balloon theme"

# Display labels (bentwire A-LABEL-1): "<name> (<product>)". bentwire takes the product
# from the source format (Microsoft Agent 2.0, Microsoft Agent 1.5, Office 97, Microsoft
# Bob) and the name from the character's English entry; [labels.<id>] overrides them where
# the files cannot tell. Qualifiers in parentheses are ours, not Microsoft's.
# Product order of the README gallery table (bentwire scripts/gallery-table.py).
products = [
  "Microsoft Agent 2.0",
  "Microsoft Agent 1.5",
  "Microsoft Agent 1.5 (third-party)",
  "Office 97",
  "Office 97 (static)",
  "Office 97 (Japanese)",
  "Microsoft Bob",
  "Greetings Workshop",
  "Greetings Workshop (early version)",
  "My Personal Tutor",
]

[labels.al-15]
product = "Microsoft Agent 1.5 (third-party)"

[labels.check-15]
product = "Microsoft Agent 1.5 (third-party)"

[labels.gourdy-15]
product = "Microsoft Agent 1.5 (third-party)"

[labels.max-15]
